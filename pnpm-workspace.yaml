packages:
  - 'packages/*'

allowBuilds:
  '@firebase/util': true
  core-js: true
  esbuild: true
  workerd: true
  msgpackr-extract: true
  protobufjs: true
  sharp: true

# Floors for vulnerable transitive resolutions (pnpm audit); each override is
# range-scoped so it becomes a no-op once the parent ranges resolve past it.
overrides:
  # @firebase/firestore (via the optional @react-native-firebase peers) still
  # pins ~1.9.0; GHSA high advisory patched only in >=1.13.6.
  '@grpc/grpc-js@<1.13.6': 1.13.6
