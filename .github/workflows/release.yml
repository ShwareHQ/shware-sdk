# Release via changesets + npm trusted publishing (OIDC).
#
# Push a changeset to main and this workflow opens (or updates) a "Version Packages" PR;
# merging that PR versions the packages and publishes them to npm.
#
# The PR is opened as the shware-release GitHub App, not as GITHUB_TOKEN: GitHub runs no
# workflows for anything GITHUB_TOKEN creates, so a PR it opened would never get the CI check
# that main's ruleset requires and could only be merged by bypassing it. The run mints a
# short-lived token from RELEASE_APP_ID / RELEASE_APP_PRIVATE_KEY (repository secrets; the app
# is installed on this repository with contents and pull-requests read/write) and hands it to
# changesets/action; with the secrets unset it falls back to GITHUB_TOKEN and the old
# behaviour. The app needs no ruleset bypass: it pushes changeset-release/main and opens the
# PR, and a person merges it. There is no NPM_TOKEN
# anywhere: npm authenticates the workflow itself through OIDC (trusted publishing), which
# also attaches provenance attestations to every published package. Publishing with a token
# is disabled on npmjs.com for all @shware packages, so this workflow is the only publish
# path.
#
# Security posture:
# - every action is pinned to a full commit SHA (tags are mutable, SHAs are not)
# - permissions are declared per job, empty by default
# - installs run with a frozen lockfile, and pnpm refuses dependency lifecycle scripts
#   unless allow-listed, so a compromised transitive dependency cannot execute on install
# - there are no secrets in this workflow for a compromised dependency to steal
name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions: {}

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # push version commits, tags, and GitHub releases
      pull-requests: write # open and update the Version Packages PR (the GITHUB_TOKEN fallback)
      id-token: write # mint the OIDC token npm exchanges for publish access
    # A step's `if` cannot read the secrets context; it can read env, so the id is copied here.
    env:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
    steps:
      # Skipped when the secrets are unset; its outputs are then empty and the action below
      # falls back to GITHUB_TOKEN.
      - name: Mint a release token
        id: app
        if: ${{ env.RELEASE_APP_ID != '' }}
        uses: actions/create-github-app-token@a8d616148505b5069dccd32f177bb87d7f39123b # v2.1.1
        with:
          app-id: ${{ env.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # changesets compares against the base branch history

      - name: Install pnpm
        run: npm install --global pnpm@11.24.0 # exact version, matches packageManager

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      # Trusted publishing needs npm >= 11.5.1 at publish time (changesets shells out to
      # `npm publish`); the floor is enforced here rather than trusted to the Node bundle.
      - name: Ensure npm supports trusted publishing
        run: npm install --global npm@^11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm run check-types

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Version or publish
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          publish-script: pnpm changeset publish
          pr-title: 'chore: release packages'
          commit-message: 'chore: release packages'
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}
